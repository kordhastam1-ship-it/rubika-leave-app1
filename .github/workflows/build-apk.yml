name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            python3-pip python3-venv \
            build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Configure Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_DIR"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Android command line tools
        run: |
          set -e

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          TEMP_DIR="$RUNNER_TEMP/android-tools"

          mkdir -p "$TEMP_DIR"
          mkdir -p "$SDK_DIR/cmdline-tools"

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$TEMP_DIR/tools.zip"

          unzip -q "$TEMP_DIR/tools.zip" -d "$TEMP_DIR"

          rm -rf "$SDK_DIR/cmdline-tools/latest"

          mv "$TEMP_DIR/cmdline-tools" \
            "$SDK_DIR/cmdline-tools/latest"

          mkdir -p "$SDK_DIR/tools/bin"

          ln -sf \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"

          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses || true

      - name: Install Android SDK packages
        run: |
          set -e

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses || true

      - name: Verify Android tools
        run: |
          set -e

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          java -version

          test -x "$SDK_DIR/tools/bin/sdkmanager"
          test -d "$SDK_DIR/build-tools"

          "$SDK_DIR/tools/bin/sdkmanager" --version

          echo "Android SDK tools are ready."

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          java -version
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rubika-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
